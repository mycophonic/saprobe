# saprobe's carve-outs from the Go lint baseline (.limen/lint-go.yaml),
# rendered with it by `just do lint go` (limen's book/linting-go.md,
# "one baseline, per-project carve-outs").
golangci:
  linters:
    settings:
      depguard:
        rules:
          main:
            allow:
              # The module's own packages, a second time with the trailing
              # slash: depguard looks an import up by sorted prefix search,
              # and the sibling modules below (saprobe-alac, ...) sort between
              # github.com/mycophonic/saprobe and github.com/mycophonic/saprobe/...,
              # so the baseline's entry for the module no longer matches its
              # packages. The slash sorts after the siblings and matches.
              - github.com/mycophonic/saprobe/
              # The decoder's dependencies, each one a reviewed choice.
              - github.com/mycophonic/primordium # the shared primitives: filesystem, app
              - github.com/mycophonic/saprobe-alac # the codecs this umbrella decoder dispatches to
              - github.com/mycophonic/saprobe-dsd
              - github.com/mycophonic/saprobe-flac
              - github.com/mycophonic/saprobe-mp3
              - github.com/jfreymuth/oggvorbis # the OggVorbis decoder
              - github.com/urfave/cli/v3 # the command line
              - github.com/mycophonic/agar # tests: reference decoders and defective audio
              - github.com/containerd/nerdctl/mod/tigron # tests: the command-line test harness
    exclusions:
      rules:
        # Tests are black-box consumers: the rules about API hygiene and
        # production robustness do not apply to them, the rules about
        # correctness do (errcheck stays on).
        - path: _test\.go
          linters:
            - dupl # test cases are meant to look alike
            - dupword # test data
            - err113 # dynamic errors are fine in fixtures
            - dogsled # multiple-return helpers are exercised for one value at a time
            - noctx # no cancellation to propagate
            - perfsprint # readability over allocations
            - mnd # fixture values

        # --- ONBOARDING BACKLOG (book/mandatory-files.md, "Onboarding an
        # existing repository"). Findings the baseline raised on enrolment and
        # nobody has read yet: not decisions, exemptions to be emptied, one
        # linter or one package per alignment pull request, each finding then
        # fixed, silenced inline with its reason, or raised as a rule. The last
        # alignment pull request deletes this block.
        #
        # gosec G115 in pcm/: the sample packing paths truncate to the output
        # width on purpose; the sites the authors annotated carry `#nosec
        # G115`, the ones they did not are here until the alignment pass
        # names them.
        - path: ^cmd/saprobe/decode\.go$
          linters: [errcheck, exhaustive]
        - path: ^cmd/saprobe/encode\.go$
          linters: [errcheck, govet]
          text: Close|shadow
        - path: ^aiff/decode\.go$
          linters: [gocognit]
        - path: ^detect/detect\.go$
          linters: [gocognit]
        - path: ^vorbis/decode\.go$
          linters: [gocognit]
        - path: ^wav/decode\.go$
          linters: [gocognit]
        - path: ^wav/encode\.go$
          linters: [mnd]
        - path: ^pcm/float\.go$
          linters: [gosec, mnd]
          text: G115|Magic number
        - path: ^pcm/truncate\.go$
          linters: [gosec]
          text: G115
        - path: ^tests/single_decode_test\.go$
          linters: [errcheck]
          # --- end of the onboarding backlog.
licenses:
  allowed:
    # The baseline's list, plus Unlicense: mycophonic/flac keeps mewkiz/flac's
    # licence, which the FLAC path depends on.
    - Apache-2.0
    - BSD-2-Clause
    - BSD-3-Clause
    - MIT
    - Unlicense
  ignore:
    # go-licenses cannot resolve the LICENSE of the gotest.tools/v3
    # submodule (google/go-licenses#186).
    - gotest.tools/v3
nilaway:
  # Onboarding backlog, as the golangci block above: NilAway reports one
  # potential nil dereference (tests/single_decode_test.go) that nobody has
  # read yet. It prints without failing the lane until the alignment pass
  # judges it; the last alignment pull request sets this back to blocking.
  blocking: false
